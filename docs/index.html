<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <title>経費申請｜ポスティングホールディングス</title>
  <style>
    :root{color:#17283e;background:#f2f6fa;font-family:system-ui,-apple-system,"Hiragino Sans","Yu Gothic",sans-serif;line-height:1.55}
    *{box-sizing:border-box}body{margin:0}header{background:#142f4a;color:white}
    header p{max-width:36rem;margin:auto;padding:1rem max(1.125rem,env(safe-area-inset-left));font-weight:700;letter-spacing:.025em}
    main{max-width:36rem;margin:auto;padding:clamp(1.25rem,6vw,3rem) max(1rem,env(safe-area-inset-right)) max(1.5rem,env(safe-area-inset-bottom)) max(1rem,env(safe-area-inset-left))}
    section{background:#fff;border:1px solid #d5e2ec;border-radius:1rem;padding:clamp(1.125rem,5vw,2rem);box-shadow:0 .3rem 1rem #1735520a}
    h1{font-size:clamp(1.6rem,7vw,2.2rem);line-height:1.2;margin:0 0 .8rem}p{margin:0 0 1.2rem;color:#4e6578}
    .open{display:flex;align-items:center;justify-content:center;min-height:3.25rem;background:#164d80;color:#fff;text-decoration:none;font-weight:700;border-radius:.58rem;padding:.65rem 1rem;text-align:center}
    .open:focus-visible{outline:3px solid #238aab;outline-offset:3px}.open:hover{background:#0d3963}
  </style>
</head>
<body>
  <header><p>ポスティングホールディングス</p></header>
  <main>
    <section aria-labelledby="title">
      <h1 id="title">経費申請</h1>
      <p>領収書や利用履歴の写真を用意して、申請フォームを開いてください。</p>
      <a class="open" href="https://script.google.com/a/macros/postech.co.jp/s/AKfycbyigLaBr0uSEkdQjSZpClQpIvJ8yUoitNt09lVJVvqyAq1FW3bNmrRgMYWeBrCC6J0p/exec">申請フォームを開く</a>
    </section>
  </main>
</body>
</html>
